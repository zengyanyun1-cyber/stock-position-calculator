<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单笔仓位计算器</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f6f7f9; color: #20242b; }
  .calculator { max-width: 560px; margin: 0 auto; padding: 24px; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 4px 18px rgba(20,30,50,.06); }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .subtitle { margin: 0 0 22px; color: #697386; font-size: 13px; }
  .field { margin: 16px 0; }
  label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
  .input-wrap { display: flex; align-items: center; border: 1px solid #d7dce3; border-radius: 8px; padding: 0 12px; background: #fff; }
  .input-wrap:focus-within { border-color: #3977d5; box-shadow: 0 0 0 3px rgba(57,119,213,.12); }
  input { width: 100%; min-width: 0; border: 0; outline: 0; padding: 12px 0; font-size: 16px; color: #20242b; background: transparent; }
  .unit { color: #778091; font-size: 13px; padding-left: 8px; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .result { padding: 16px; border-radius: 10px; background: #f3f6fa; min-width: 0; }
  .result.primary { background: #edf4ff; }
  .result-label { color: #596579; font-size: 12px; line-height: 1.5; }
  .result-value { margin-top: 7px; font-size: clamp(23px, 5vw, 30px); font-weight: 700; letter-spacing: -.5px; overflow-wrap: anywhere; }
  .result-unit { margin-left: 4px; font-size: 13px; font-weight: 500; color: #697386; }
  .details { margin-top: 16px; padding: 14px; border: 1px solid #e8ebf0; border-radius: 9px; font-size: 13px; line-height: 1.9; color: #4f5968; }
  .details strong { color: #20242b; font-variant-numeric: tabular-nums; }
  .error { min-height: 20px; margin-top: 12px; color: #c43c3c; font-size: 13px; }
  .note { margin: 16px 0 0; color: #818a98; font-size: 12px; line-height: 1.7; }
  button { margin-top: 16px; padding: 9px 14px; border: 1px solid #d7dce3; border-radius: 7px; background: #fff; color: #364152; cursor: pointer; font-size: 13px; }
  button:hover { background: #f7f8fa; }
  @media (max-width: 420px) { body { padding: 10px; } .calculator { padding: 18px; } .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="calculator">
  <h1>单笔仓位计算器</h1>
  <p class="subtitle">填写风险金额、入场价格和结构止损价格，自动计算计划买入股数。</p>

  <div class="field">
    <label for="risk">单笔允许亏损金额</label>
    <div class="input-wrap"><input id="risk" type="number" min="0" step="any" value="1000" inputmode="decimal"><span class="unit">元</span></div>
  </div>
  <div class="field">
    <label for="entry">入场价格</label>
    <div class="input-wrap"><input id="entry" type="number" min="0" step="any" value="50" inputmode="decimal"><span class="unit">元</span></div>
  </div>
  <div class="field">
    <label for="stop">结构止损价格</label>
    <div class="input-wrap"><input id="stop" type="number" min="0" step="any" value="45" inputmode="decimal"><span class="unit">元</span></div>
  </div>

  <section class="results" aria-live="polite">
    <div class="result primary">
      <div class="result-label">理论计划买入股数</div>
      <div class="result-value"><span id="theoretical">200</span><span class="result-unit">股</span></div>
    </div>
    <div class="result">
      <div class="result-label">按 A 股 100 股取整</div>
      <div class="result-value"><span id="rounded">200</span><span class="result-unit">股</span></div>
    </div>
  </section>

  <div class="details">
    每股风险：<strong id="perShare">5.00</strong> 元<br>
    计划占用资金：<strong id="capital">10,000.00</strong> 元<br>
    取整后预计亏损：<strong id="actualRisk">1,000.00</strong> 元<br>
    取整后剩余风险额度：<strong id="remaining">0.00</strong> 元
  </div>
  <div class="error" id="error" role="alert"></div>
  <button type="button" id="reset">恢复示例数据</button>
  <p class="note">计算公式：计划买入股数 = 单笔允许亏损金额 ÷（入场价格 − 结构止损价格）。A 股取整结果向下取整至 100 股整数倍。计算未包含手续费、滑点及跳空风险，实际亏损可能超过计划金额。</p>
</main>
<script>
(() => {
  const ids = ["risk", "entry", "stop"];
  const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const fmt = n => Number(n).toLocaleString("zh-CN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const whole = n => Math.floor(n).toLocaleString("zh-CN");
  function calculate() {
    const risk = Number(el.risk.value);
    const entry = Number(el.entry.value);
    const stop = Number(el.stop.value);
    const error = document.getElementById("error");
    const valid = ids.every(id => el[id].value.trim() !== "") &&
      Number.isFinite(risk) && Number.isFinite(entry) && Number.isFinite(stop) &&
      risk > 0 && stop >= 0 && entry > stop;
    if (!valid) {
      document.getElementById("theoretical").textContent = "—";
      document.getElementById("rounded").textContent = "—";
      ["perShare", "capital", "actualRisk", "remaining"].forEach(id => document.getElementById(id).textContent = "—");
      error.textContent = "请输入有效数值：允许亏损金额须大于 0，入场价格须高于结构止损价格。";
      return;
    }
    error.textContent = "";
    const perShare = entry - stop;
    const shares = Math.floor(risk / perShare);
    const rounded = Math.floor(shares / 100) * 100;
    const actualRisk = rounded * perShare;
    document.getElementById("theoretical").textContent = whole(shares);
    document.getElementById("rounded").textContent = whole(rounded);
    document.getElementById("perShare").textContent = fmt(perShare);
    document.getElementById("capital").textContent = fmt(rounded * entry);
    document.getElementById("actualRisk").textContent = fmt(actualRisk);
    document.getElementById("remaining").textContent = fmt(risk - actualRisk);
  }
  ids.forEach(id => el[id].addEventListener("input", calculate));
  document.getElementById("reset").addEventListener("click", () => {
    el.risk.value = "1000"; el.entry.value = "50"; el.stop.value = "45"; calculate();
  });
  calculate();
})();
</script>
</body>
</html>
